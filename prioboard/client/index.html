      style="display: none"
      aria-hidden="true"

    <div class="app">
      <aside>
        <div class="brand"><span class="logo">pb</span> Priority board</div>
        <nav class="nav" aria-label="Main navigation">
          <button data-view="opportunities" class="active">
            <span data-icon="list-ordered"></span> Opportunities
          </button>
          <button data-view="clusters">
            <span data-icon="layout-grid"></span> Clusters
            <span id="cluster-count" class="count"></span>
          </button>
          <button data-view="input">
            <span data-icon="inbox"></span> Inputs
            <span id="input-count" class="count"></span>
          </button>
          <button data-view="context">
            <span data-icon="target"></span> Context
            <span id="context-count" class="count"></span>
          </button>
          <button data-view="output">
            <span data-icon="history"></span> Reports
            <span id="output-count" class="count"></span>
          </button>
        </nav>
        <div class="sidebar-foot">
          <span id="sync-status" role="status">Connecting…</span>
          <button id="profile-card" type="button" title="Switch user"></button>
        </div>
      </aside>
      <dialog id="profile-dialog" aria-label="Choose your name"></dialog>
      <main>
        <header>
          <div>
            <div class="crumb" id="crumb">Priority board / Saved dataset</div>
            <h1 id="title">Opportunities</h1>
          </div>
          <div class="actions">
            <div
              id="board-members"
              class="board-members"
              aria-label="Board members"
            ></div>
            <span class="small muted" id="workspace-name"></span
            ><button id="download" disabled>Download dataset</button
            ><button class="primary" id="open-folder">Upload folder</button>
          </div>
        </header>
        <input type="file" id="folder-input" webkitdirectory multiple hidden />
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div id="toolbar" class="badges"></div>
        <div id="errors" aria-live="polite"></div>
        <section id="content" aria-label="Workspace content"></section>
      </main>
    </div>
    <dialog id="source-dialog" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <div>
          <h2 id="dialog-title">Source</h2>
          <div id="dialog-path" class="reader-path"></div>
        </div>
        <button id="close-dialog" aria-label="Close source">Close ×</button>
      </div>
      <div id="dialog-content" class="dialog-body"></div>
    </dialog>
    <script type="module" src="/assets/main.js"></script>
  </body>
</html>
